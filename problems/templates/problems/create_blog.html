{% extends 'core/base.html' %}

{% block title %}Create Blog - CodeCollab{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold text-purple-800 mb-6">Create New Blog</h1>
        <p class="text-gray-600 mb-8">Share your programming insights with the community</p>

        <form method="post" class="bg-white p-6 rounded-lg shadow-md">
            {% csrf_token %}
            
            <div class="mb-6">
                <label for="{{ form.title.id_for_label }}" class="block text-gray-700 mb-2">Title</label>
                {{ form.title }}
            </div>
            
            <div class="mb-6">
                <label for="{{ form.content.id_for_label }}" class="block text-gray-700 mb-2">Content</label>
                {{ form.content }}
            </div>
            
            <div class="mb-6">
                <label for="{{ form.status.id_for_label }}" class="block text-gray-700 mb-2">Status</label>
                {{ form.status }}
            </div>
            
            <div class="mb-6">
                <label class="block text-gray-700 mb-2">Tags</label>
                <input type="text" name="tags_str" class="w-full border rounded px-3 py-2" placeholder="Enter tags separated by commas (e.g., python, django, tutorial)">
            </div>
            
            <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition duration-300 text-lg">
                Create Blog
            </button>
        </form>
    </div>
</div>
{% endblock %}
