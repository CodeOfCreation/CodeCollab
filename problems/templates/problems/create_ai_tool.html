{% extends 'core/base.html' %}

{% block title %}Create AI Tool - CodeCollab{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-3xl mx-auto">
        <h1 class="text-3xl font-bold text-purple-800 mb-6">Add New AI Tool</h1>
        <p class="text-gray-600 mb-8">Share an AI tool with the community</p>

        <form method="post" class="bg-white p-6 rounded-lg shadow-md">
            {% csrf_token %}
            
            <div class="mb-6">
                <label for="{{ form.name.id_for_label }}" class="block text-gray-700 mb-2">Tool Name</label>
                {{ form.name }}
            </div>
            
            <div class="mb-6">
                <label for="{{ form.description.id_for_label }}" class="block text-gray-700 mb-2">Description</label>
                {{ form.description }}
            </div>
            
            <div class="mb-6">
                <label for="{{ form.link.id_for_label }}" class="block text-gray-700 mb-2">Tool Link</label>
                {{ form.link }}
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="{{ form.category.id_for_label }}" class="block text-gray-700 mb-2">Category</label>
                    {{ form.category }}
                </div>
                
                <div>
                    <label class="block text-gray-700 mb-2">Tags</label>
                    <input type="text" name="tags_str" class="w-full border rounded px-3 py-2" placeholder="Enter tags separated by commas (e.g., ai, productivity, automation)">
                </div>
            </div>
            
            <button type="submit" class="w-full bg-purple-600 text-white py-3 rounded-lg hover:bg-purple-700 transition duration-300 text-lg">
                Add AI Tool
            </button>
        </form>
    </div>
</div>
{% endblock %}
