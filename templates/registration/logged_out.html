{% extends 'core/base.html' %}

{% block title %}Logged Out - CodeCollab{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-md mx-auto bg-white p-8 rounded-lg shadow-md text-center">
        <h2 class="text-2xl font-bold mb-6 text-purple-800">You have been logged out</h2>
        <p class="text-gray-600 mb-6">Thank you for using CodeCollab. Your session has ended securely.</p>
        <a href="{% url 'login' %}" class="bg-purple-600 text-white px-6 py-2 rounded-lg hover:bg-purple-700 transition duration-300 inline-block">
            Login Again
        </a>
    </div>
</div>
{% endblock %}
